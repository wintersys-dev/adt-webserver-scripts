server.modules += ( "mod_rewrite", "mod_proxy", "mod_magnet" )

# 1. Main Assets Location Handler
$HTTP["url"] =~ "^/XXXXASSETSXXXX/" {
    
    # Strip /XXXXASSETSXXXX/ from the request path before forwarding
    url.rewrite-once = ( "^/XXXXASSETSXXXX/(.*)" => "/$1" )
    
    # Modify request headers sent to the S3 backend
    setenv.add-request-header = (
        "Host" => "XXXXS3_HOST_URLXXXX",
        "Referer" => "https://XXXXREFERERXXXX",
        "Cookie" => "" # Clears the cookie header
    )
    
    # Proxy requests to the S3 backend
    proxy.server = ( "" => ( ( 
        "host" => "XXXXS3_HOST_URLXXXX", 
        "port" => 443 
    ) ) )
    
    # Handle the 404 Intercept / Fallback logic
    # (Requires a small Lua script via mod_magnet to intercept backend 404s)
    magnet.attract-response-start-to = ( "/etc/lighttpd/s3_fallback.lua" )
}

# 2. Fallback Target (Internal Redirect Destination)
$HTTP["url"] =~ "^/fallback_XXXXASSETSXXXX/" {
    
    # Restore the original path prefix
    url.rewrite-once = ( "^/fallback_XXXXASSETSXXXX/(.*)" => "/XXXXASSETSXXXX/$1" )
    
    # Forward headers to the local webservers
    # Note: Lighttpd automatically passes Host, X-Forwarded-For, and X-Forwarded-Proto natively
    
    # Proxy back to your local webservers cluster
proxy.server = ( "" => ( 
    ( 
        "host" => "192.168.1.10", # Sort this to be the backend webserver ip addresses
        "port" => 443 
    ),
    ( 
        "host" => "192.168.1.11", # Second backend server
        "port" => 443 
    )
) )
    
    # Cache Control Note: Lighttpd natively respects backend Cache-Control headers.
    # For strict time-based proxy caching overrides like Nginx's proxy_cache_valid,
    # use mod_cache or mod_flv_streaming depending on your Lighttpd generation version.
}
